[package]
name = "dtop"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A fast, local-first terminal monitor for Docker"
license = "MIT"
repository = "https://github.com/themostpoordev/dtop"
keywords = ["docker", "terminal", "tui", "monitor"]
categories = ["command-line-utilities"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dependencies]
anyhow = "1"
bollard = { version = "0.21", default-features = false, features = ["pipe"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
