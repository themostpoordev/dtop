# dtop configuration. Copy to ~/.config/dtop/config.toml if desired.
# Docker access is local-only through this Unix socket.
docker_socket = "/var/run/docker.sock"
# mode: "docker" (containers/images/volumes/networks/events)
#       "all"    (host CPU/memory/disk/network/processes, btop-style)
mode = "docker"
theme = "default"
sort = "cpu"
show_stopped = true
follow_logs = true
density = "comfortable"
show_hints = true
show_gpu = true
