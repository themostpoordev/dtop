name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify Cargo.toml version matches tag
        run: |
          cargo_version=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if [ "$cargo_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Cargo.toml version ($cargo_version) does not match tag (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Build release binary
        run: cargo build --release --locked

      - name: Strip binary
        run: strip --strip-unneeded target/release/dtop

      - name: Package tarball
        run: |
          asset="dtop-v${{ steps.version.outputs.version }}-linux-x86_64"
          mkdir -p "$asset"
          cp target/release/dtop "$asset/dtop"
          cp README.md "$asset/README.md"
          cp LICENSE "$asset/LICENSE"
          tar -C "$asset" -czf "${asset}.tar.gz" .
          sha256sum "${asset}.tar.gz" > "${asset}.tar.gz.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dtop-v${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
            dtop-v${{ steps.version.outputs.version }}-linux-x86_64.tar.gz.sha256
          generate_release_notes: true
