name: Release

# Trigger: publishing a GitHub Release (web UI or `gh release create`) builds
# the artifacts and attaches them to that same release. The tag `vX.Y.Z`
# must match `version` in Cargo.toml.
on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  assets:
    name: Build and upload assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Resolve version from release tag
        id: version
        run: |
          tag="${{ github.event.release.tag_name }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Verify Cargo.toml version matches release tag
        run: |
          cargo_version=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if [ "$cargo_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Cargo.toml version ($cargo_version) does not match release tag (${{ steps.version.outputs.tag }})"
            exit 1
          fi

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Build release binary
        run: cargo build --release --locked

      # Stripping is already handled by `[profile.release] strip = true` in
      # Cargo.toml — no separate `strip` step needed.
      - name: Package tarball
        run: |
          asset="dtop-v${{ steps.version.outputs.version }}-linux-x86_64"
          mkdir -p "$asset"
          cp target/release/dtop "$asset/dtop"
          cp README.md "$asset/README.md"
          cp LICENSE "$asset/LICENSE"
          cp config/dtop.example.toml "$asset/dtop.example.toml"
          # Top-level folder inside the tarball (no tarbomb on extract).
          tar -czf "${asset}.tar.gz" "$asset"
          sha256sum "${asset}.tar.gz" > "${asset}.tar.gz.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dtop-v${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
            dtop-v${{ steps.version.outputs.version }}-linux-x86_64.tar.gz.sha256
